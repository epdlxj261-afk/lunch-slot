# Web 서버(Nginx): React 빌드 결과(정적 파일) 제공 + /api 요청을 App 서버(FastAPI)로 전달.
# 설치: sudo bash deploy/setup_web_server.sh
#   (이 파일을 /etc/nginx/sites-available/lunch-slot.conf로 복사하고 sites-enabled에 연결한다)
# 같은 서버의 80번은 다른 서비스(task-flow), 8080번은 FastAPI가 사용하므로 8081번을 쓴다.

# App 서버 주소. Web·App 서버를 분리하면 App 서버 사설 IP:포트로 바꾼다.
upstream lunch_slot_api {
    server 127.0.0.1:8080;
}

server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    # npm run build 결과(frontend/dist)를 복사해 둔 위치
    root /var/www/lunch-slot;
    index index.html;

    # 사용자 입력이 HTML로 실행되지 않도록 보조하는 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://lunch_slot_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 빌드 파일 이름에 해시가 붙으므로 오래 캐시해도 된다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        # location 안에서 add_header를 쓰면 상위 헤더가 상속되지 않으므로 다시 적는다.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # index.html은 새 빌드가 바로 반영되도록 캐시하지 않는다.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
